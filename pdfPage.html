<script>
    // Usamos window.onload para asegurar que la página cargó totalmente
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const nombreArchivo = urlParams.get('archivo');
        const visor = document.getElementById('pdf-viewer');

        if (nombreArchivo) {
            console.log("Intentando cargar:", nombreArchivo);
            
            // Si el nombre viene con "https", lo usa directo. 
            // Si no, busca en tu carpeta local.
            const rutaFinal = nombreArchivo.startsWith('http') 
                              ? nombreArchivo 
                              : "documentos/" + nombreArchivo;

            visor.src = rutaFinal;
            
            // Actualizar título
            document.title = nombreArchivo.split('/').pop().replace('.pdf', '');
        } else {
            console.error("Error: No se detectó el parámetro 'archivo' en la URL");
        }
    };
</script>
